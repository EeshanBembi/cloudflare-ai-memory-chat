name = "cloudflare-ai-memory-chat"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Workers AI - Llama 3.3
[ai]
binding = "AI"

# Durable Object for Memory/State
[durable_objects]
bindings = [
  { name = "MEMORY_DO", class_name = "MemoryDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MemoryDO"]

# Workflows for coordination
[[workflows]]
name = "ai-memory-workflow"
binding = "AI_WORKFLOW"
class_name = "AIMemoryWorkflow"

# KV for fallback cache (optional)
[[kv_namespaces]]
binding = "CACHE_KV"
id = "placeholder-kv-id"
preview_id = "placeholder-kv-preview-id"

[vars]
FRONTEND_URL = "https://cloudflare-ai-memory-chat.pages.dev"
MODEL_ID = "@cf/meta/llama-3.3-70b-instruct"

[observability.logs]
enabled = true
